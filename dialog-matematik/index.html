<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dialog Prestasi Matematik 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE work: dialog prestasi, dibentang kepada pentadbir & guru
   IDEA buku laporan pentaksiran sekolah yang dicetak: jadual kemas, satu blok kuning untuk angka utama
   PICTURE bar bertindan taburan TP / gred per kelas, matriks TP lawan gred UASA
   COLOUR putih, dakwat #101418, kuning #ffd84a untuk angka utama; Lemah oren-merah, Sederhana kuning, Cemerlang biru tua
   TYPE Manrope 800 untuk tajuk, Manrope untuk teks
   LAYOUT pentas 16:9 1600x900 diskalakan; di telefon slaid mengalir satu lajur */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#101418);--ink:light-dark(#101418,#eef1f4);--slate:light-dark(#5b6573,#a3adba);--rule:light-dark(#dfe3e8,#2b323b);--panel:light-dark(#f4f6f8,#182029);--y:#ffd84a;--yi:#101418;--L:#e4572e;--S:#f5c53a;--C:#1f3fbf;--C2:light-dark(#1f3fbf,#7d97ff)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 Manrope,system-ui,sans-serif;overflow:hidden}
button,select{font:inherit;color:inherit}
#vp{position:fixed;inset:0 0 60px 0;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0}
.sl{width:1600px;height:900px;padding:52px 72px 36px;display:flex;flex-direction:column;gap:22px;background:var(--bg)}
.sl h1{font-size:76px;line-height:1.02;letter-spacing:-.025em;margin:0;font-weight:800;text-wrap:balance}
.sl h2{font-size:44px;line-height:1.06;letter-spacing:-.02em;margin:0;font-weight:800;text-wrap:balance;max-width:1300px}
.sl h3{font-size:22px;margin:0 0 10px;font-weight:700}
.kick{font-size:20px;color:var(--slate);font-weight:600}
.kick b{color:var(--ink)}
.grow{flex:1;min-height:0}
.row{display:flex;gap:28px}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:36px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.note{font-size:15px;color:var(--slate)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0;border-top:2px solid var(--ink)}
.kpi{padding:14px 18px 12px 0;border-right:1px solid var(--rule);margin-right:18px}
.kpi:last-child{border-right:0}
.kpi .v{font-size:46px;font-weight:800;line-height:1.05;letter-spacing:-.02em;white-space:nowrap}
.kpi .l{font-size:16px;color:var(--slate)}
.kpi.hot{background:var(--y);color:var(--yi);padding-left:18px}
.kpi.hot .l{color:#3b3f45}
.bars{display:flex;flex-direction:column;gap:10px}
.br{display:grid;grid-template-columns:150px minmax(0,1fr) 92px;gap:14px;align-items:center}
.br .lb{font-weight:700;font-size:18px;white-space:nowrap}
.br .vl{font-weight:700;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.stk{display:flex;height:34px;border-radius:3px;overflow:hidden;background:var(--panel)}
.stk i{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:14px;font-weight:700;color:#fff}
.stk i.lt{color:#101418}
.track{height:26px;background:var(--panel);border-radius:3px;position:relative}
.track>i{position:absolute;left:0;top:0;bottom:0;background:var(--slate);border-radius:3px}
.track>i.on{background:var(--C)}
.track>i.red{background:var(--L)}
.leg{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:15px;color:var(--slate)}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg span::before{content:"";width:14px;height:14px;border-radius:2px;background:var(--c)}
table{border-collapse:collapse;width:100%}
th{font-size:14px;color:var(--slate);text-align:left;font-weight:600;border-bottom:2px solid var(--ink);padding:6px 8px}
td{border-bottom:1px solid var(--rule);padding:5px 8px;font-size:16px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.go{cursor:pointer}
tr.go:hover td{background:var(--panel)}
.nm{max-width:330px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:14px;font-weight:700;white-space:nowrap}
.pL{background:var(--L);color:#fff}.pS{background:var(--S);color:#101418}.pC{background:var(--C);color:#fff}
.gap{color:var(--L);font-weight:800;font-size:14px;margin-left:6px}
.btn{border:2px solid var(--ink);background:transparent;padding:10px 18px;border-radius:6px;font-weight:700;cursor:pointer;min-height:44px}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.y{background:var(--y);color:#101418;border-color:var(--y)}
.btn:focus-visible,select:focus-visible,.card:focus-visible{outline:3px solid var(--C2);outline-offset:2px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.card{border:1px solid var(--rule);border-radius:8px;padding:16px;cursor:pointer;background:var(--bg);text-align:left;display:flex;flex-direction:column;gap:8px}
.card:hover{border-color:var(--ink)}
.card b{font-size:22px}
.card .m{font-size:15px;color:var(--slate)}
.links{display:flex;flex-direction:column;gap:10px}
.links button{text-align:left}
select{border:2px solid var(--ink);border-radius:6px;padding:8px 10px;background:var(--bg);font-size:17px;min-height:44px;width:100%}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.col{border-top:6px solid var(--c);padding-top:10px;display:flex;flex-direction:column;min-height:0}
.col h3{display:flex;justify-content:space-between}
.names{display:flex;flex-direction:column;overflow:auto}
.names button{border:0;background:none;text-align:left;padding:5px 2px;border-bottom:1px solid var(--rule);font-size:16px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.names button:hover{background:var(--panel)}
.names button span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.names em{font-style:normal;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.mx td{text-align:center;font-weight:700;font-size:20px;height:52px}
.mx td.h{text-align:left;font-weight:700;font-size:17px}
.big{font-size:120px;font-weight:800;line-height:.95;letter-spacing:-.03em}
.box{background:var(--panel);border-radius:8px;padding:20px 22px}
.box.y{background:var(--y);color:#101418}
.box.y .note{color:#3b3f45}
ul.t{margin:0;padding-left:22px}ul.t li{margin:4px 0}
#bar{position:fixed;left:0;right:0;bottom:0;height:60px;display:flex;align-items:center;gap:10px;padding:0 max(16px,2vw);border-top:1px solid var(--rule);background:var(--bg);z-index:5}
#bar .sp{flex:1}
#bar .btn{padding:6px 14px;min-height:42px;font-size:15px}
#crumb{font-size:14px;color:var(--slate);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cnt{font-size:14px;color:var(--slate);font-variant-numeric:tabular-nums;white-space:nowrap}
/* telefon: aliran biasa */
body.flow{overflow:auto}
body.flow #vp{position:static;overflow:visible;padding-bottom:70px}
body.flow #stage{position:static;width:auto;height:auto;transform:none!important}
body.flow .sl{width:auto;height:auto;padding:22px 16px}
body.flow .sl h1{font-size:40px}
body.flow .sl h2{font-size:28px}
body.flow .g2,body.flow .g3,body.flow .cols3{grid-template-columns:minmax(0,1fr)!important}
body.flow .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
body.flow .br{grid-template-columns:86px minmax(0,1fr) 64px;gap:8px}
body.flow .br .lb{font-size:14px}
body.flow .kpi .v{font-size:32px}
body.flow .big{font-size:72px}
body.flow .row{flex-direction:column;align-items:stretch!important}
body.flow .box .big{font-size:64px}
body.flow .row>.pill{align-self:flex-start}
body.flow .nm{max-width:150px}
body.flow td{font-size:14px;padding:5px 4px}
body.flow .scroll{overflow-x:auto}
body.flow #crumb{display:none}
body.flow .hideflow{display:none}
@media print{#bar{display:none}}
</style>
</head>
<body>
<div id="vp"><div id="stage"></div></div>
<nav id="bar">
<button class="btn" id="bMenu">Menu utama</button>
<span id="crumb"></span>
<span class="sp"></span>
<span id="cnt"></span>
<button class="btn" id="bPrev" aria-label="Slaid sebelum">◀</button>
<button class="btn" id="bNext" aria-label="Slaid seterusnya">▶</button>
<button class="btn hideflow" id="bFull">Skrin penuh</button>
</nav>
<script>
{
/* Versi awam: angka agregat sahaja. Tiada nama murid, IC atau markah individu (peraturan 3.1 BLUEPRINT). */
const D = {"K":[{"id":"1b","nama":"Tahun 1 Bijak","uasaFile":false,"n":28,"dist":[0,0,4,15,3,6],"avgTP":4.4,"oth":4.5,"hasU":false,"cat":{"L":0,"S":19,"C":9},"jan":{"L":{"n":18,"tp":4.4,"u":null},"P":{"n":10,"tp":4.3,"u":null}}},{"id":"2b","nama":"Tahun 2 Bijak","uasaFile":false,"n":23,"dist":[0,0,1,9,8,5],"avgTP":4.7,"oth":5.0,"hasU":false,"cat":{"L":0,"S":10,"C":13},"jan":{"L":{"n":9,"tp":4.7,"u":null},"P":{"n":14,"tp":4.8,"u":null}}},{"id":"2c","nama":"Tahun 2 Cerdik","uasaFile":false,"n":24,"dist":[0,1,3,16,0,4],"avgTP":4.1,"oth":4.6,"hasU":false,"cat":{"L":1,"S":19,"C":4},"jan":{"L":{"n":13,"tp":3.8,"u":null},"P":{"n":11,"tp":4.5,"u":null}}},{"id":"3b","nama":"Tahun 3 Bijak","uasaFile":false,"n":29,"dist":[0,0,4,7,7,11],"avgTP":4.9,"oth":4.6,"hasU":false,"cat":{"L":0,"S":11,"C":18},"jan":{"L":{"n":17,"tp":4.8,"u":null},"P":{"n":12,"tp":5,"u":null}}},{"id":"4b","nama":"Tahun 4 Bijak","uasaFile":true,"n":32,"dist":[0,0,0,14,10,8],"avgTP":4.8,"oth":4.8,"hasU":false,"cat":{"L":0,"S":14,"C":18},"jan":{"L":{"n":12,"tp":5.2,"u":null},"P":{"n":20,"tp":4.5,"u":null}}},{"id":"5b","nama":"Tahun 5 Bijak","uasaFile":true,"n":21,"dist":[0,0,6,4,10,1],"avgTP":4.3,"oth":5.2,"hasU":true,"cat":{"L":10,"S":6,"C":5},"jan":{"L":{"n":10,"tp":4.5,"u":45.4},"P":{"n":11,"tp":4.1,"u":39.5}},"grd":[0,5,3,3,9,1],"uAvg":42.3,"lulus":11,"cplus":8,"nu":21,"gap":4,"jx":[{"t":3,"C":0,"S":0,"L":6,"avg":22.3},{"t":4,"C":0,"S":0,"L":4,"avg":26.5},{"t":5,"C":4,"S":6,"L":0,"avg":57.2},{"t":6,"C":1,"S":0,"L":0,"avg":null}]},{"id":"5c","nama":"Tahun 5 Cerdik","uasaFile":true,"n":19,"dist":[0,0,0,9,6,4],"avgTP":4.7,"oth":4.6,"hasU":true,"cat":{"L":16,"S":3,"C":0},"jan":{"L":{"n":9,"tp":5,"u":24.2},"P":{"n":10,"tp":4.5,"u":17.9}},"grd":[0,0,0,3,6,10],"uAvg":20.9,"lulus":3,"cplus":0,"nu":19,"gap":16,"jx":[{"t":4,"C":0,"S":0,"L":9,"avg":15.2},{"t":5,"C":0,"S":0,"L":6,"avg":18.3},{"t":6,"C":0,"S":3,"L":1,"avg":37.5}]},{"id":"6b","nama":"Tahun 6 Bijak","uasaFile":true,"n":29,"dist":[0,0,0,17,8,4],"avgTP":4.6,"oth":5.1,"hasU":true,"cat":{"L":21,"S":6,"C":2},"jan":{"L":{"n":20,"tp":4.4,"u":26.1},"P":{"n":9,"tp":4.9,"u":38.7}},"grd":[0,2,2,4,11,10],"uAvg":30.0,"lulus":8,"cplus":4,"nu":29,"gap":21,"jx":[{"t":4,"C":0,"S":0,"L":17,"avg":19.2},{"t":5,"C":0,"S":4,"L":4,"avg":37.8},{"t":6,"C":2,"S":2,"L":0,"avg":60}]}],"T":{"n":205,"dist":[0,1,18,91,52,43],"avgTP":4.6,"uN":69,"uAvg":31.2,"lulus":22,"cplus":12,"ef":47,"gap":41,"tp4u":63,"cat":{"L":48,"S":88,"C":69},"tp4":186,"tp56":95}};
const K = D.K, T = D.T;
const SUBJ = {"4b": {"BM": null, "BI": null, "MM": null, "SAINS": null, "SEJ": 54.7, "PAI": 67.9, "PSV": 75.9, "PMZ": 76.6, "AR": 66.5, "PJPK": 74.2, "RBT": 71.1}, "5b": {"BM": 76.1, "BI": 56.3, "MM": 42.3, "SAINS": 58.6, "SEJ": 65.5, "PAI": 76.1, "PSV": 75.3, "PMZ": 74.2, "AR": 79.7, "PJPK": 67.4, "RBT": 80.6}, "5c": {"BM": 66.3, "BI": 35.9, "MM": 20.9, "SAINS": 40, "SEJ": 53.6, "PAI": 61.7, "PSV": 60.3, "PMZ": 72.9, "AR": 59.4, "PJPK": 47.3, "RBT": 72.6}, "6b": {"BM": 71.7, "BI": 46.8, "MM": 30.0, "SAINS": 49.4, "SEJ": 63.7, "PAI": 68.1, "PSV": 78, "PMZ": 76, "AR": 77.8, "PJPK": 84.3, "RBT": 63.3}};
const NAMA_SUBJ = {BM:'B. Melayu',BI:'B. Inggeris',MM:'Matematik',SAINS:'Sains',SEJ:'Sejarah',PAI:'Pend. Islam',PMZ:'Muzik',PSV:'Seni Visual',PJPK:'PJK',AR:'B. Arab',RBT:'RBT'};
const esc = v => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f1 = x => x == null ? '—' : (Math.round(x*10)/10).toFixed(1);
const pc = (a,b) => b ? Math.round(a/b*100) : 0;
const TPC = {1:'#9e2a14',2:'#e4572e',3:'#f2a93b',4:'#ffd84a',5:'#6f8fe8',6:'#1f3fbf'};
const GC = {A:'#142a85',B:'#1f3fbf',C:'#ffd84a',D:'#f2a93b',E:'#e4572e',F:'#9e2a14'};
const LT = {3:1,4:1,C:1,D:1,S:1};
const CATN = {L:'Lemah',S:'Sederhana',C:'Cemerlang'};
const UK = K.filter(k=>k.hasU);
const kById = id => K.find(k=>k.id===id);
const sgn = x => (x>=0?'+':'') + f1(x);

const stk = (arr, cols, keys) => {
  const n = arr.reduce((a,b)=>a+b,0);
  return `<div class="stk">${arr.map((v,i)=> v? `<i class="${LT[keys[i]]?'lt':''}" style="width:${v/n*100}%;background:${cols[keys[i]]}" title="${keys[i]}: ${v}">${v/n>=.05?v:''}</i>`:'').join('')}</div>`;
};
const tpStk = d => stk(d, TPC, [1,2,3,4,5,6]);
const gStk = d => stk(d, GC, ['A','B','C','D','E','F']);
const catStk = c => stk([c.L,c.S,c.C], {L:'var(--L)',S:'var(--S)',C:'var(--C)'}, ['L','S','C']);
const tpLeg = `<div class="leg">${[1,2,3,4,5,6].map(t=>`<span style="--c:${TPC[t]}">TP${t}</span>`).join('')}</div>`;
const gLeg = `<div class="leg">${'ABCDEF'.split('').map(g=>`<span style="--c:${GC[g]}">${g}</span>`).join('')}<span style="--c:transparent">A ≥82 · B 66–81 · C 50–65 · D 35–49 · E 20–34 · F &lt;20</span></div>`;
const kpi = (v,l,hot) => `<div class="kpi${hot?' hot':''}"><div class="v">${v}</div><div class="l">${l}</div></div>`;
const catNote = `<p class="note">Kategori: jika ada markah UASA — Cemerlang gred A–B (≥66), Sederhana C–D (35–65), Lemah E–F (&lt;35). Tanpa UASA — ikut TP PBD: Cemerlang TP5–6, Sederhana TP3–4, Lemah TP1–2.</p>`;
const awam = `<p class="note">Versi awam: angka agregat sahaja. Senarai dan profil murid hanya dalam versi dalaman guru.</p>`;

const V = {};
V.tajuk = () => `<section class="sl" style="justify-content:space-between">
  <div class="kick"><b>SK Paya Redan</b> · Panitia Matematik · Sesi 2026</div>
  <div><h1>Dialog Prestasi Matematik 2026</h1>
  <p style="font-size:26px;margin:18px 0 0;max-width:1100px">Analisis Pentaksiran Bilik Darjah (PBD) akhir tahun dan Ujian Akhir Sesi Akademik (UASA) mengikut kelas.</p></div>
  <div class="kpis">${kpi(T.n,'murid dalam 8 kelas, Tahun 1–6')}${kpi(f1(T.avgTP),'purata TP Matematik (PBD)')}${kpi(pc(T.tp4,T.n)+'%','murid TP4 ke atas')}${kpi(f1(T.uAvg),`purata markah UASA (${T.uN} murid Tahun 5–6)`,1)}</div>
  <div class="row" style="align-items:center"><button class="btn y" data-go="menu">Buka menu utama ▶</button><span class="note">Kekunci ◀ ▶ untuk beralih slaid · M untuk menu · F untuk skrin penuh</span></div>
</section>`;

V.menu = () => `<section class="sl">
  <div class="kick">Menu utama</div>
  <h2>Pilih analisis atau kelas</h2>
  <div class="row grow" style="gap:40px">
    <div style="width:360px;display:flex;flex-direction:column;gap:22px">
      <div><h3>Analisis sekolah</h3><div class="links">
        <button class="btn" data-go="pbd">Rumusan PBD semua kelas</button>
        <button class="btn" data-go="uasa">Keputusan UASA Matematik</button>
        <button class="btn" data-go="subjek">Matematik berbanding subjek lain</button>
        <button class="btn" data-go="jurang">Jurang PBD dan UASA</button>
        <button class="btn" data-go="kategori">Murid lemah, sederhana, cemerlang</button>
        <button class="btn" data-go="cadangan">Cadangan tindakan</button></div></div>
      ${awam}
    </div>
    <div class="grow"><h3>Kelas</h3><div class="cards">${K.map(k=>`<button class="card" data-go="k-${k.id}">
      <b>${esc(k.nama)}</b><span class="m">${k.n} murid · TP purata ${f1(k.avgTP)}</span>
      ${tpStk(k.dist)}
      <span class="m">${k.hasU?`UASA purata <b style="font-size:15px;color:var(--ink)">${f1(k.uAvg)}</b> · ${k.lulus}/${k.nu} gred D ke atas`:(k.uasaFile?'UASA Matematik: Tidak Ditaksir':'Tiada data UASA')}</span>
      <span class="m"><span style="color:var(--L);font-weight:700">${k.cat.L} lemah</span> · ${k.cat.S} sederhana · <span style="color:var(--C2);font-weight:700">${k.cat.C} cemerlang</span></span></button>`).join('')}</div>
      <div style="margin-top:14px">${tpLeg}</div></div>
  </div>
</section>`;

V.pbd = () => `<section class="sl">
  <div class="kick">Rumusan sekolah · PBD akhir tahun</div>
  <h2>${pc(T.tp4,T.n)}% murid diberi TP4 ke atas; hanya ${T.dist[0]+T.dist[1]} murid di TP1–2</h2>
  <div class="kpis">${kpi(T.n,'murid')}${kpi(f1(T.avgTP),'purata TP Matematik',1)}${kpi(T.tp56+` <span style="font-size:22px">(${pc(T.tp56,T.n)}%)</span>`,'TP5–6')}${kpi(T.dist[2]+T.dist[3]+` <span style="font-size:22px">(${pc(T.dist[2]+T.dist[3],T.n)}%)</span>`,'TP3–4')}${kpi(T.dist[0]+T.dist[1],'TP1–2')}</div>
  <div class="grow bars" style="justify-content:center">
    ${K.map(k=>`<div class="br"><span class="lb">${esc(k.nama.replace('Tahun ','T'))}</span>${tpStk(k.dist)}<span class="vl">TP ${f1(k.avgTP)}</span></div>`).join('')}
    <div class="br"><span class="lb">Sekolah</span>${tpStk(T.dist)}<span class="vl">TP ${f1(T.avgTP)}</span></div>
  </div>
  ${tpLeg}
  <p class="note">Bilangan murid di setiap TP. Tahun 4 Bijak, 5 Cerdik dan 6 Bijak tiada murid di bawah TP4.</p>
</section>`;

V.uasa = () => `<section class="sl">
  <div class="kick">Rumusan sekolah · UASA Matematik</div>
  <h2>Hanya ${T.lulus} daripada ${T.uN} murid Tahun 5–6 mendapat gred D ke atas dalam UASA</h2>
  <div class="g2 grow">
    <div class="bars" style="justify-content:center">
      ${UK.map(k=>`<div class="br"><span class="lb">${esc(k.nama.replace('Tahun ','T'))}</span>${gStk(k.grd)}<span class="vl">${k.lulus}/${k.nu}</span></div>`).join('')}
      ${gLeg}
      <p class="note">Angka kanan: murid gred D ke atas (≥35). Tahun 4 Bijak: markah UASA Matematik tercatat “Tidak Ditaksir”. Tahun 1–3: tiada data UASA.</p>
    </div>
    <div class="scroll"><table><tr><th>Kelas</th><th class="n">Murid</th><th class="n">Purata</th><th class="n">D ke atas</th><th class="n">C ke atas</th><th class="n">E/F</th></tr>
      ${UK.map(k=>`<tr class="go" data-go="k-${k.id}"><td><b>${esc(k.nama)}</b></td><td class="n">${k.nu}</td><td class="n"><b>${f1(k.uAvg)}</b></td><td class="n">${k.lulus}</td><td class="n">${k.cplus}</td><td class="n">${k.grd[4]+k.grd[5]}</td></tr>`).join('')}
      <tr><td><b>Keseluruhan</b></td><td class="n">${T.uN}</td><td class="n"><b>${f1(T.uAvg)}</b></td><td class="n">${T.lulus}</td><td class="n">${T.cplus}</td><td class="n">${T.ef}</td></tr></table>
      <div class="box y" style="margin-top:22px"><div style="font-size:54px;font-weight:800;line-height:1">${T.ef} <span style="font-size:26px">/ ${T.uN} murid</span></div><div style="font-size:18px">mendapat gred E atau F (bawah 35 markah). Tiada murid mendapat gred A.</div></div>
    </div>
  </div>
</section>`;

V.subjek = () => {
  const blk = k => { const rows = Object.entries(SUBJ[k.id]).filter(e=>e[1]!=null).sort((x,y)=>x[1]-y[1]);
    return `<div><h3>${esc(k.nama)}</h3><div class="bars" style="gap:12px">${rows.map(([s,v])=>`<div class="br" style="grid-template-columns:110px minmax(0,1fr) 46px;gap:8px"><span class="lb" style="font-size:15px;${s==='MM'?'':'font-weight:500'}">${NAMA_SUBJ[s]}</span><div class="track"><i class="${s==='MM'?'red':''}" style="width:${v}%"></i></div><span class="vl" style="font-size:15px">${f1(v)}</span></div>`).join('')}</div></div>`; };
  return `<section class="sl">
  <div class="kick">Rumusan sekolah · purata markah UASA mengikut subjek</div>
  <h2>Matematik mencatat purata UASA terendah dalam ketiga-tiga kelas</h2>
  <div class="g3 grow">${UK.map(blk).join('')}</div>
  <p class="note">Purata markah kelas bagi setiap subjek, disusun dari terendah. Jurang Matematik dengan B. Inggeris (kedua terendah): ${UK.map(k=>`${esc(k.nama)} ${f1(SUBJ[k.id].BI-SUBJ[k.id].MM)} markah`).join(' · ')}. Bagi PBD, purata TP Matematik berbanding purata TP subjek lain: ${K.map(k=>`${k.nama.replace('Tahun ','T')} ${sgn(k.avgTP-k.oth)}`).join(' · ')}.</p>
</section>`; };

V.jurang = () => {
  const cell = (n, bad) => n ? `<td style="background:${bad?'color-mix(in srgb,var(--L) '+Math.min(90,25+n*6)+'%,transparent)':'var(--panel)'};${bad&&n>=6?'color:#fff':''}">${n}</td>` : '<td style="color:var(--slate)">·</td>';
  const mx = k => `<div><h3>${esc(k.nama)}</h3><table class="mx"><tr><th></th><th class="n">A–B</th><th class="n">C–D</th><th class="n">E–F</th><th class="n">Purata</th></tr>
    ${k.jx.map(r=>`<tr><td class="h">TP${r.t}</td>${cell(r.C,0)}${cell(r.S,0)}${cell(r.L,r.t>=4)}<td style="font-size:17px">${r.avg==null?'<span class="note">—</span>':f1(r.avg)}</td></tr>`).join('')}</table></div>`;
  const k5c = kById('5c');
  return `<section class="sl">
  <div class="kick">Keselarasan PBD dan UASA · Tahun 5–6</div>
  <h2>${T.gap} daripada ${T.tp4u} murid yang diberi TP4 ke atas mendapat gred E/F dalam UASA</h2>
  <div class="g3">${UK.map(mx).join('')}</div>
  <div class="g2 grow" style="align-items:start">
    <div class="box"><h3>Apa yang ditunjukkan</h3><ul class="t">
      <li>Dalam Tahun 5 Cerdik, ${k5c.gap} daripada ${k5c.n} murid berada di TP4–6 tetapi gred E/F.</li>
      <li>Tahun 5 Bijak paling selari: semua murid TP3 mendapat E/F, dan kebanyakan murid TP5–6 mendapat C ke atas.</li>
      <li>Petak merah: TP4 ke atas tetapi E/F. Purata disembunyikan bagi kumpulan kurang 3 murid.</li>
      <li>Petunjuk usaha Matematik bagi semua murid Tahun 4–6 dicatat “Tinggi”.</li></ul></div>
    <div class="box y"><h3>Soalan untuk dialog</h3><ul class="t">
      <li>Adakah eviden TP4 (menguasai dengan baik) mencerminkan kemahiran sebenar murid?</li>
      <li>Perlukah moderasi TP Matematik dibuat antara guru sebelum laporan dimuktamadkan?</li>
      <li>Adakah format atau aras soalan UASA berbeza ketara daripada tugasan PBD di kelas?</li></ul></div>
  </div>
</section>`; };

V.kategori = () => `<section class="sl">
  <div class="kick">Murid mengikut kategori</div>
  <h2>${T.cat.L} murid lemah, ${T.cat.S} sederhana dan ${T.cat.C} cemerlang</h2>
  <div class="scroll grow"><table><tr><th>Kelas</th><th>Asas kategori</th><th class="n">Lemah</th><th class="n">Sederhana</th><th class="n">Cemerlang</th><th style="width:38%">Taburan</th></tr>
    ${K.map(k=>`<tr class="go" data-go="k-${k.id}"><td><b>${esc(k.nama)}</b></td><td>${k.hasU?'UASA':'TP PBD'}</td><td class="n" style="color:var(--L);font-weight:800">${k.cat.L}</td><td class="n">${k.cat.S}</td><td class="n" style="color:var(--C2);font-weight:800">${k.cat.C}</td><td>${catStk(k.cat)}</td></tr>`).join('')}
    <tr><td><b>Jumlah</b></td><td></td><td class="n"><b>${T.cat.L}</b></td><td class="n"><b>${T.cat.S}</b></td><td class="n"><b>${T.cat.C}</b></td><td></td></tr></table></div>
  ${catNote}
</section>`;

V.cadangan = () => `<section class="sl">
  <div class="kick">Cadangan tindakan</div>
  <h2>Fokus 2027: kemahiran asas murid lemah dan TP yang selari dengan UASA</h2>
  <div class="cols3 grow">
    <div class="col" style="--c:var(--L)"><h3>Lemah <span>${T.cat.L} murid</span></h3><ul class="t">
      <li>Kelas bimbingan kumpulan kecil, terutama Tahun 5 Cerdik dan murid Tahun 5 Bijak yang naik ke Tahun 6.</li>
      <li>Ujian diagnostik awal tahun: nilai tempat, sifir, empat operasi asas.</li>
      <li>Latih tubi fakta asas 10 minit setiap hari dengan bahan konkrit.</li>
      <li>Pantau kemajuan setiap bulan dan maklum ibu bapa.</li></ul></div>
    <div class="col" style="--c:var(--S)"><h3>Sederhana <span>${T.cat.S} murid</span></h3><ul class="t">
      <li>Latihan topikal mengikut topik yang paling banyak hilang markah.</li>
      <li>Ajar langkah menyelesaikan soalan berayat (fahami, rancang, selesai, semak).</li>
      <li>Latihan bertahap dari aras sederhana ke aras tinggi.</li>
      <li>Sasaran: naik satu gred dalam UASA seterusnya.</li></ul></div>
    <div class="col" style="--c:var(--C)"><h3>Cemerlang <span>${T.cat.C} murid</span></h3><ul class="t">
      <li>Aktiviti pengayaan dan soalan KBAT.</li>
      <li>Jadikan pembimbing rakan sebaya dalam kumpulan.</li>
      <li>Sertai pertandingan Matematik peringkat daerah dan negeri.</li></ul></div>
  </div>
  <div class="box y"><b>Tindakan panitia:</b> moderasi TP Matematik antara guru sebelum laporan PBD dimuktamadkan · lengkapkan markah UASA Tahun 4 Bijak (kini “Tidak Ditaksir”) · bandingkan item UASA dengan tugasan PBD bagi Tahun 5–6.</div>
</section>`;

const kelasRing = k => {
  const t = k.hasU ? `${k.grd[4]+k.grd[5]} daripada ${k.nu} murid mendapat gred E/F dalam UASA` :
    `${k.dist[4]+k.dist[5]} daripada ${k.n} murid di TP5–6; ${k.dist[0]+k.dist[1]+k.dist[2]} murid di TP3 ke bawah`;
  const gender = g => g.n ? `${g.n} murid · TP ${f1(g.tp)}${k.hasU?` · UASA ${f1(g.u)}`:''}` : '—';
  return `<section class="sl">
  <div class="kick"><b>${esc(k.nama)}</b> · Ringkasan kelas</div>
  <h2>${t}</h2>
  <div class="kpis">${kpi(k.n,'murid')}${kpi(f1(k.avgTP),'purata TP Matematik',!k.hasU)}${kpi(k.dist[4]+k.dist[5],'murid TP5–6')}
    ${k.hasU?kpi(f1(k.uAvg),'purata UASA',1)+kpi(`${k.lulus}/${k.nu}`,'gred D ke atas')+kpi(k.cplus,'gred C ke atas'):kpi(k.dist[0]+k.dist[1]+k.dist[2],'murid TP3 ke bawah')}</div>
  <div class="g2 grow">
    <div style="display:flex;flex-direction:column;gap:14px"><h3>Taburan TP Matematik (PBD)</h3>
      <div class="bars">${[6,5,4,3,2,1].map(t=>`<div class="br" style="grid-template-columns:70px minmax(0,1fr) 70px"><span class="lb">TP${t}</span><div class="track"><i style="width:${k.dist[t-1]/k.n*100}%;background:${TPC[t]}"></i></div><span class="vl">${k.dist[t-1]}</span></div>`).join('')}</div>
      <p class="note">Purata TP subjek lain kelas ini: ${f1(k.oth)} (Matematik ${sgn(k.avgTP-k.oth)}).</p>
      <h3>Kategori murid</h3>${catStk(k.cat)}
      <p class="note">${k.cat.L} lemah · ${k.cat.S} sederhana · ${k.cat.C} cemerlang (asas: ${k.hasU?'UASA':'TP PBD'})</p></div>
    <div style="display:flex;flex-direction:column;gap:14px">
      ${k.hasU?`<h3>Taburan gred UASA</h3><div class="bars">${'ABCDEF'.split('').map((g,i)=>`<div class="br" style="grid-template-columns:70px minmax(0,1fr) 70px"><span class="lb">${g}</span><div class="track"><i style="width:${k.grd[i]/k.nu*100}%;background:${GC[g]}"></i></div><span class="vl">${k.grd[i]}</span></div>`).join('')}</div>
      <p class="note">Jurang PBD–UASA: ${k.gap} murid TP4 ke atas mendapat E/F.</p>`:
      `<div class="box"><h3>UASA</h3><p style="margin:0">${k.uasaFile?'Markah UASA Matematik (juga BM, BI dan Sains) tercatat “Tidak Ditaksir” dalam laporan murid kelas ini. Analisis menggunakan TP PBD sahaja.':'Tiada data UASA untuk kelas ini. Analisis menggunakan TP PBD sahaja.'}</p></div>`}
      <div class="box"><h3>Mengikut jantina</h3><p style="margin:0">Lelaki: ${gender(k.jan.L)}<br>Perempuan: ${gender(k.jan.P)}</p></div>
    </div>
  </div>
</section>`; };

const SEQ = ['tajuk','menu','pbd','uasa','subjek','jurang','kategori', ...K.map(k=>`k-${k.id}`), 'cadangan'];
const LABEL = {tajuk:'Tajuk',menu:'Menu utama',pbd:'Rumusan PBD',uasa:'UASA',subjek:'Matematik vs subjek lain',jurang:'Jurang PBD–UASA',kategori:'Kategori murid',cadangan:'Cadangan'};
let cur = 'tajuk';
const stage = document.getElementById('stage');
const parse = h => {
  if (V[h]) return {html: V[h](), lab: LABEL[h]};
  const m = h.match(/^k-(\w\w)$/);
  if (m && kById(m[1])) { const k = kById(m[1]); return {html: kelasRing(k), lab: k.nama}; }
  return null;
};
const show = h => {
  let p = parse(h); if (!p) { h = 'tajuk'; p = parse(h); }
  cur = h; stage.innerHTML = p.html;
  document.getElementById('crumb').textContent = p.lab;
  document.getElementById('cnt').textContent = `${SEQ.indexOf(h)+1} / ${SEQ.length}`;
  if (location.hash.slice(1) !== h) { try { history.replaceState(null,'','#'+h); } catch(e) {} }
  if (document.body.classList.contains('flow')) window.scrollTo(0,0);
};
const step = d => { const i = SEQ.indexOf(cur) + d; if (SEQ[i]) show(SEQ[i]); };
document.addEventListener('click', e => { const t = e.target.closest('[data-go]'); if (t) show(t.dataset.go); });
document.getElementById('bMenu').onclick = () => show('menu');
document.getElementById('bPrev').onclick = () => step(-1);
document.getElementById('bNext').onclick = () => step(1);
document.getElementById('bFull').onclick = () => { const d = document.documentElement; try { (document.fullscreenElement ? document.exitFullscreen() : d.requestFullscreen()).catch(()=>{}); } catch(e) {} };
document.addEventListener('keydown', e => {
  if (['ArrowRight','PageDown',' '].includes(e.key)) { e.preventDefault(); step(1); }
  else if (['ArrowLeft','PageUp'].includes(e.key)) { e.preventDefault(); step(-1); }
  else if (e.key === 'm' || e.key === 'M' || e.key === 'Home') show('menu');
  else if (e.key === 'f' || e.key === 'F') document.getElementById('bFull').click();
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== cur) show(h); });
const fit = () => {
  const W = window.innerWidth, H = window.innerHeight - 60;
  const flow = W < 760;
  document.body.classList.toggle('flow', flow);
  if (flow) return;
  const s = Math.min(W/1600, H/900);
  stage.style.transform = `scale(${s})`;
  stage.style.left = (W - 1600*s)/2 + 'px';
  stage.style.top = (H - 900*s)/2 + 'px';
};
const ro = new ResizeObserver(fit); ro.observe(document.body);
fit();
show(location.hash.slice(1) || 'tajuk');
}
</script>

</body>
</html>
