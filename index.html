<style>
  /* ================= TOKEN ================= */
  :root{
    color-scheme: light;
    --plane:#f4f6fb;
    --plane-2:#eaeef8;
    --surface:#ffffff;
    --surface-soft:#f7f8fc;
    --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --grid:#e6e7ee; --axis:#c3c2b7; --border:rgba(11,11,11,.09);
    /* siri data — palet disahkan (CVD-safe) */
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
    --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
    --up:#006300;
    --accent:#0e6b25; --accent-2:#4a9c15;
    --grad:linear-gradient(135deg,#0e6b25 0%,#4a9c15 100%);
    --wash:rgba(14,107,37,.07);
    --brand-kuning:#e6e619;
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 10px 28px -14px rgba(16,24,40,.22);
    --shadow-lg:0 2px 4px rgba(16,24,40,.06), 0 18px 40px -18px rgba(16,24,40,.30);
    --r:16px; --r-sm:10px;
    --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:where(:not([data-theme="light"])){
      color-scheme: dark;
      --plane:#0b0c0f; --plane-2:#101218;
      --surface:#16171c; --surface-soft:#1c1e25;
      --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
      --grid:#26272e; --axis:#383835; --border:rgba(255,255,255,.10);
      --s1:#3987e5; --s2:#d95926; --s3:#199e70;
      --up:#0ca30c;
      --accent:#2fa845; --accent-2:#7cc32a;
      --grad:linear-gradient(135deg,#2fa845 0%,#7cc32a 100%);
      --wash:rgba(47,168,69,.16);
      --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 28px -14px rgba(0,0,0,.8);
      --shadow-lg:0 2px 4px rgba(0,0,0,.5), 0 18px 40px -18px rgba(0,0,0,.9);
      --brand-kuning:#e6e619;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --plane:#0b0c0f; --plane-2:#101218;
    --surface:#16171c; --surface-soft:#1c1e25;
    --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#26272e; --axis:#383835; --border:rgba(255,255,255,.10);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --up:#0ca30c;
    --accent:#2fa845; --accent-2:#7cc32a;
    --grad:linear-gradient(135deg,#2fa845 0%,#7cc32a 100%);
    --wash:rgba(47,168,69,.16);
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 28px -14px rgba(0,0,0,.8);
    --shadow-lg:0 2px 4px rgba(0,0,0,.5), 0 18px 40px -18px rgba(0,0,0,.9);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:
      radial-gradient(1100px 520px at 12% -8%, var(--plane-2) 0%, transparent 62%),
      radial-gradient(900px 460px at 100% 0%, var(--wash) 0%, transparent 58%),
      var(--plane);
    background-attachment: fixed;
    color:var(--ink); font-family:var(--font);
    font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:1240px;margin:0 auto;padding:22px 20px 72px}

  /* ================= HEADER ================= */
  .top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:18px}
  .brand{display:flex;align-items:center;gap:13px;min-width:0}
  .crest{
    width:56px;height:56px;border-radius:16px;flex:none;
    background:#ffffff;border:1px solid var(--border);
    display:grid;place-items:center;padding:5px;
    color:var(--accent);font-weight:750;font-size:15px;letter-spacing:.4px;
    box-shadow:0 6px 18px -8px rgba(14,107,37,.45);
  }
  .crest img{width:100%;height:100%;object-fit:contain;display:block}
  h1{font-size:21px;line-height:1.2;margin:0;font-weight:700;letter-spacing:-.02em}
  .sub{color:var(--ink2);font-size:12.5px;margin-top:3px}
  .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  button,select,label.file{
    font:inherit;font-size:13px;font-weight:500;color:var(--ink);
    background:var(--surface);
    border:1px solid var(--border);border-radius:999px;padding:9px 15px;cursor:pointer;
    box-shadow:var(--shadow);
    transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
  }
  button:hover,label.file:hover{background:var(--surface-soft);transform:translateY(-1px);box-shadow:var(--shadow-lg)}
  button:active,label.file:active{transform:translateY(0)}
  select{border-radius:var(--r-sm);padding:9px 12px;box-shadow:none}
  .field{display:flex;flex-direction:column;gap:5px;min-width:0}
  .field span{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
  input[type=file]{display:none}

  /* ================= FILTER ================= */
  .filters{
    display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
    padding:13px 16px;margin-bottom:16px;box-shadow:var(--shadow);
  }
  .filters .spacer{flex:1}
  .stamp{font-size:12px;color:var(--muted)}

  /* ================= TAB ================= */
  nav.tabs{
    display:flex;gap:6px;margin-bottom:18px;padding:5px;
    background:var(--surface);border:1px solid var(--border);
    border-radius:999px;box-shadow:var(--shadow);
    overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{
    flex:none;background:none;border:none;box-shadow:none;border-radius:999px;
    padding:9px 16px;color:var(--ink2);font-size:13.5px;font-weight:550;white-space:nowrap;
  }
  nav.tabs button:hover{background:var(--wash);transform:none;box-shadow:none}
  nav.tabs button[aria-selected="true"]{
    background:var(--grad);color:#fff;font-weight:650;
    box-shadow:0 6px 16px -8px rgba(14,107,37,.55);
  }

  /* ================= LAYOUT ================= */
  .grid{display:grid;gap:14px;grid-template-columns:repeat(12,1fr)}
  .col-12{grid-column:span 12}
  .col-8{grid-column:span 8}
  .col-6{grid-column:span 6}
  .col-4{grid-column:span 4}

  /* ================= KAD ================= */
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
    padding:17px 18px 14px;min-width:0;box-shadow:var(--shadow);
    transition:box-shadow .16s ease, transform .16s ease;
  }
  .card:hover{box-shadow:var(--shadow-lg)}
  .card > header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:2px}
  .card h2{font-size:14.5px;font-weight:650;margin:0;letter-spacing:-.01em}
  .card .note{font-size:12px;color:var(--muted);margin:3px 0 12px;line-height:1.45}
  .secnote{font-size:12px;color:var(--muted);margin:0 0 14px;line-height:1.45}
  .pepbar{margin:0 0 12px}
  .pepbar .field{display:inline-flex}
  .card .tgl{font-size:11.5px;padding:5px 12px;color:var(--ink2);box-shadow:none;flex:none}

  /* ================= TILE ================= */
  .tiles{display:grid;gap:13px;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));margin-bottom:16px}
  .tile{
    position:relative;overflow:hidden;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
    padding:15px 17px 16px;box-shadow:var(--shadow);
    transition:transform .16s ease, box-shadow .16s ease;
  }
  .tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
  .tile::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;
    background:linear-gradient(180deg,var(--accent) 0%,var(--accent-2) 62%,var(--brand-kuning,#e6e619) 100%)}
  .tile .lab{font-size:11.5px;color:var(--ink2);font-weight:550;letter-spacing:.01em}
  .tile .val{font-size:32px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin-top:8px}
  .tile .val small{font-size:16px;font-weight:600;color:var(--ink2);margin-left:2px}
  .tile .delta{
    display:inline-flex;align-items:center;gap:5px;margin-top:9px;
    font-size:11.5px;font-weight:550;color:var(--ink2);
    background:var(--surface-soft);border:1px solid var(--border);
    border-radius:999px;padding:3px 10px;
  }
  .tile .delta.up{color:var(--up)} .tile .delta.down{color:var(--crit)}

  /* ================= LEGEND ================= */
  .legend{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px;font-size:11.5px;color:var(--ink2)}
  .legend span{
    display:inline-flex;align-items:center;
    background:var(--surface-soft);border:1px solid var(--border);
    border-radius:999px;padding:3px 10px 3px 8px;font-weight:550;
  }
  .legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:6px}

  /* ================= CARTA ================= */
  .chart{touch-action:pan-y}
  .chart svg{display:block;width:100%;overflow:visible}
  .chart text{font-family:var(--font)}
  .hit{fill:transparent}

  /* ================= JADUAL ================= */
  table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
  th,td{text-align:right;padding:7px 9px;border-bottom:1px solid var(--grid);white-space:nowrap}
  th:first-child,td:first-child{text-align:left;font-variant-numeric:normal;white-space:normal}
  thead th{color:var(--muted);font-weight:650;font-size:11px;text-transform:uppercase;letter-spacing:.05em;position:sticky;top:0;background:var(--surface)}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover td{background:var(--surface-soft)}
  .tblwrap{overflow:auto;max-height:360px;border-radius:var(--r-sm)}

  /* ================= TOOLTIP ================= */
  #tip{
    position:fixed;pointer-events:none;z-index:50;opacity:0;transition:opacity .09s;
    background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:9px 12px;font-size:12px;color:var(--ink);
    box-shadow:var(--shadow-lg);min-width:132px;
  }
  #tip .t{font-weight:700;margin-bottom:5px}
  #tip .r{display:flex;justify-content:space-between;gap:16px;line-height:1.75}
  #tip .r i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:6px}
  #tip .r b{font-weight:650;font-variant-numeric:tabular-nums}

  .empty{color:var(--muted);font-size:13px;padding:24px 0;text-align:center}
  footer.foot{margin-top:30px;color:var(--muted);font-size:12px;line-height:1.7}
  .pill{
    display:inline-block;border:1px solid var(--border);background:var(--surface);
    border-radius:999px;padding:4px 12px;font-size:11px;color:var(--ink2);font-weight:550;
  }

  /* ================= RESPONSIF ================= */
  @media (max-width:1000px){
    .col-8{grid-column:span 12}
    .col-6{grid-column:span 6}
    .col-4{grid-column:span 6}
  }
  @media (max-width:760px){
    body{font-size:14.5px}
    .wrap{padding:14px 13px 56px}
    .col-8,.col-6,.col-4{grid-column:span 12}
    .grid{gap:12px}
    .top{gap:12px}
    h1{font-size:18.5px}
    .crest{width:46px;height:46px;border-radius:13px;font-size:14px;padding:4px}
    .tools{width:100%}
    .tools button,.tools label.file{flex:1;text-align:center;padding:10px 12px}
    .filters{padding:12px;gap:12px}
    .filters .field{flex:1 1 44%}
    .filters select{width:100%}
    .filters .spacer{display:none}
    .stamp{flex:1 1 100%;order:3}
    .tiles{grid-template-columns:repeat(2,1fr);gap:10px}
    .tile{padding:13px 14px 14px;border-radius:14px}
    .tile .val{font-size:25px;margin-top:6px}
    .tile .val small{font-size:13px}
    .tile .lab{font-size:11px}
    .tile .delta{font-size:10.5px;padding:2px 8px;margin-top:7px}
    .card{padding:15px 14px 12px;border-radius:14px}
    .card:hover{transform:none}
    nav.tabs{margin-bottom:14px}
    nav.tabs button{padding:9px 14px;font-size:13px}
    .tblwrap{max-height:300px}
  }
  @media (max-width:330px){
    .tiles{grid-template-columns:1fr}
  }
  @media (hover:none){
    .card:hover,.tile:hover{transform:none;box-shadow:var(--shadow)}
    button:hover,label.file:hover{transform:none;box-shadow:var(--shadow)}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }

  /* ================= MOD TV ================= */
  #tvbar{display:none;position:fixed;top:0;left:0;right:0;height:4px;background:var(--border);z-index:60}
  #tvbar i{display:block;height:100%;width:0;background:var(--grad)}
  #tvExit{position:fixed;bottom:18px;right:18px;z-index:61;opacity:.35}
  #tvExit:hover{opacity:1}
  :root[data-tv] #tvbar{display:block}
  :root[data-tv] .tools,
  :root[data-tv] .filters,
  :root[data-tv] footer.foot,
  :root[data-tv] .card .tgl{display:none!important}
  :root[data-tv] body{font-size:18px}
  :root[data-tv] .wrap{max-width:none;padding:26px 34px 34px}
  :root[data-tv] h1{font-size:28px}
  :root[data-tv] .sub{font-size:15px}
  :root[data-tv] .crest{width:72px;height:72px;border-radius:20px}
  :root[data-tv] .tiles{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
  :root[data-tv] .tile .lab{font-size:14px}
  :root[data-tv] .tile .val{font-size:46px}
  :root[data-tv] .tile .delta{font-size:14px}
  :root[data-tv] .card h2{font-size:20px}
  :root[data-tv] .card .note{font-size:14px}
  :root[data-tv] nav.tabs button{font-size:17px;padding:12px 22px}
  :root[data-tv] .legend{font-size:14px}
  :root[data-tv] #tip{display:none}

  /* ================= LAPORAN RINGKAS ================= */
  #laporan{display:none}
  :root[data-mode="laporan"] #laporan{display:block}
  :root[data-mode="laporan"] .top,
  :root[data-mode="laporan"] .filters,
  :root[data-mode="laporan"] nav.tabs,
  :root[data-mode="laporan"] main,
  :root[data-mode="laporan"] footer.foot{display:none!important}
  #laporan .kepala{display:flex;align-items:center;gap:14px;padding-bottom:12px;
    border-bottom:2px solid var(--accent);margin-bottom:16px}
  #laporan .kepala img{width:62px;height:62px;object-fit:contain}
  #laporan .kepala h2{margin:0;font-size:19px;font-weight:750;letter-spacing:-.01em}
  #laporan .kepala .meta{font-size:12.5px;color:var(--ink2);margin-top:3px}
  #laporan .kepala .kanan{margin-left:auto;text-align:right;font-size:12px;color:var(--muted)}
  #laporan .kpi{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}
  #laporan .kpi > div{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--surface)}
  #laporan .kpi .l{font-size:10.5px;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em;font-weight:600;line-height:1.3}
  #laporan .kpi .v{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:5px}
  #laporan .kpi .v small{font-size:13px;font-weight:600;color:var(--ink2)}
  #laporan .blok{border:1px solid var(--border);border-radius:12px;padding:14px 15px;background:var(--surface);margin-bottom:14px}
  #laporan .blok h3{margin:0 0 10px;font-size:13.5px;font-weight:650}
  #laporan .dua{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  #laporan .muka2{margin-top:14px}
  #laporan .nota{font-size:11px;color:var(--muted);margin-top:10px}
  #laporan .tblwrap{max-height:none;overflow:visible}
  #laporan table{font-size:11.5px}
  #laporan th,#laporan td{padding:4px 7px}
  #laporan thead th{position:static}
  #laporan .lapbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  @media print{ #laporan .lapbar{display:none!important} }
  @media (max-width:760px){
    #laporan .kpi{grid-template-columns:repeat(2,1fr)}
    #laporan .dua{grid-template-columns:1fr}
    #btnTv{display:none}
  }

  @page{size:A4;margin:11mm}
  @media print{
    body{background:#fff}
    .tools,.filters,nav.tabs,.card .tgl,#tvbar,#tvExit{display:none!important}
    :root:not([data-mode="laporan"]) .sect{display:block!important;break-inside:avoid}
    .card,.tile{break-inside:avoid;border-color:#ccc;box-shadow:none}
    .wrap{max-width:none;padding:0}
    #laporan .blok,#laporan .kpi > div{break-inside:avoid;box-shadow:none}
    #laporan .muka2{break-before:page}
  }
</style>
</head>

const $ = (s,r)=> (r||document).querySelector(s);
const nf0 = new Intl.NumberFormat('ms-MY');
const nf1 = new Intl.NumberFormat('ms-MY',{minimumFractionDigits:1,maximumFractionDigits:1});
const nf2 = new Intl.NumberFormat('ms-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtInt = v => nf0.format(v);
const fmtPct = v => nf1.format(v)+'%';
const fmtGp  = v => nf2.format(v);
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const sum = (a,f)=> a.reduce((t,x)=>t+(f?f(x):x),0);

let DATA = DATA_TERBINA;
let STATE = { sesi:null, tab:'ringkasan', density:'all', pep:null };
const REG = [];              // pendaftaran carta untuk render semula

function tail(arr){ return STATE.density==='all' ? arr : arr.slice(-parseInt(STATE.density,10)); }

/* ============================ TOOLTIP ============================ */
const tipEl = $('#tip');
function showTip(html, x, y){
  tipEl.innerHTML = html; tipEl.style.opacity = 1;
  const r = tipEl.getBoundingClientRect();
  let left = x + 14, top = y - r.height - 12;
  if(left + r.width > innerWidth - 8) left = x - r.width - 14;
  if(top < 8) top = y + 18;
  tipEl.style.left = left+'px'; tipEl.style.top = top+'px';
}
function hideTip(){ tipEl.style.opacity = 0; }
function tipRow(color,label,val){
  return `<div class="r"><span>${color?`<i style="background:${color}"></i>`:''}${esc(label)}</span><b>${esc(val)}</b></div>`;
}

/* ============================ PRIMITIF SVG ============================ */
function barPath(x,y,w,h,r,dir){
  if(w<=0||h<=0) return '';
  r = Math.max(0, Math.min(r, w/2, h/2));
  if(dir==='up')
    return `M${x},${y+h} L${x},${y+r} Q${x},${y} ${x+r},${y} L${x+w-r},${y} Q${x+w},${y} ${x+w},${y+r} L${x+w},${y+h} Z`;
  if(dir==='right')
    return `M${x},${y} L${x+w-r},${y} Q${x+w},${y} ${x+w},${y+r} L${x+w},${y+h-r} Q${x+w},${y+h} ${x+w-r},${y+h} L${x},${y+h} Z`;
  return `M${x},${y} h${w} v${h} h${-w} Z`;
}
function niceTicks(min,max,count){
  if(min===max){ min = Math.min(0,min); max = max||1; }
  const span = max-min, step0 = span/Math.max(1,count);
  const mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const norm = step0/mag;
  const step = (norm<=1?1:norm<=2?2:norm<=2.5?2.5:norm<=5?5:10)*mag;
  const lo = Math.floor(min/step)*step, hi = Math.ceil(max/step)*step;
  const out=[]; for(let v=lo; v<=hi+step/1e6; v+=step) out.push(+v.toFixed(10));
  return out;
}
function trunc(s, max){ s=String(s); return s.length>max ? s.slice(0,max-1)+'…' : s; }
function wrapLabel(s, max){
  s = String(s);
  if(s.length<=max) return [s];
  const w = s.split(' '); const lines=[]; let cur='';
  for(const t of w){ if((cur+' '+t).trim().length>max){ if(cur) lines.push(cur); cur=t; } else cur=(cur+' '+t).trim(); }
  if(cur) lines.push(cur);
  return lines.slice(0,2);
}

/* ============================ CARTA: LAJUR ============================ */
/* cfg: {labels:[], series:[{name,varName,values:[]}], fmt, stacked, yMin, yMax, yLabel, labelEvery} */
function drawColumn(node, cfg){
  const W = Math.max(240, node.clientWidth);
  const narrow = W < 460;
  const H = Math.round((cfg.height || 240) * (narrow ? 0.88 : 1));
  const m = {t:12, r:narrow?6:10, b:narrow?40:34, l:narrow?34:44};
  const iw = W-m.l-m.r, ih = H-m.t-m.b;
  const cols = cfg.series.map(s=>cssVar(s.varName));
  const n = cfg.labels.length;
  const totals = cfg.labels.map((_,i)=> cfg.stacked ? sum(cfg.series,s=>s.values[i]) : Math.max(...cfg.series.map(s=>s.values[i])));
  const dmax = cfg.yMax!=null ? cfg.yMax : Math.max(...totals);
  const dmin = cfg.yMin!=null ? cfg.yMin : 0;
  const ticks = niceTicks(dmin, dmax, 4);
  const lo = ticks[0], hi = ticks[ticks.length-1];
  const Y = v => m.t + ih - (v-lo)/(hi-lo)*ih;
  const band = iw/n, gap = Math.min(18, band*0.30);
  const bw = band-gap;
  const nS = cfg.series.length;
  const gw = cfg.stacked ? bw : (bw - 2*(nS-1))/nS;

  let g = '';
  ticks.forEach(t=>{
    g += `<line x1="${m.l}" y1="${Y(t).toFixed(1)}" x2="${m.l+iw}" y2="${Y(t).toFixed(1)}" stroke="${t===lo?cssVar('--axis'):cssVar('--grid')}" stroke-width="1"/>`;
    g += `<text x="${m.l-8}" y="${(Y(t)+4).toFixed(1)}" text-anchor="end" font-size="11" fill="${cssVar('--muted')}" style="font-variant-numeric:tabular-nums">${esc(cfg.tickFmt?cfg.tickFmt(t):fmtInt(t))}</text>`;
  });

  let bars='', hits='';
  for(let i=0;i<n;i++){
    const x0 = m.l + i*band + gap/2;
    if(cfg.stacked){
      let acc = lo;
      cfg.series.forEach((s,si)=>{
        const v = s.values[i]; const y1 = Y(acc+v), y0 = Y(acc);
        let h = y0-y1; const isTop = si===cfg.series.length-1;
        const yy = y1 + (isTop?0:0); const hh = Math.max(0, h - (isTop?0:2)); // jurang 2px antara segmen
        bars += `<path d="${barPath(x0, yy, bw, hh, isTop?4:0, isTop?'up':'flat')}" fill="${cols[si]}"/>`;
        acc += v;
      });
    } else {
      cfg.series.forEach((s,si)=>{
        const v = s.values[i]; const y = Y(v), h = Y(lo)-y;
        bars += `<path d="${barPath(x0+si*(gw+2), y, gw, h, 4,'up')}" fill="${cols[si]}"/>`;
      });
    }
    const step = cfg.labelEvery || Math.max(1, Math.ceil(n / Math.floor(iw/38)));
    if(i%step===0){
      const lines = wrapLabel(cfg.labels[i], Math.max(6, Math.floor(band/6.5)));
      lines.forEach((ln,li)=>{
        bars += `<text x="${(x0+bw/2).toFixed(1)}" y="${m.t+ih+16+li*12}" text-anchor="middle" font-size="11" fill="${cssVar('--muted')}">${esc(ln)}</text>`;
      });
    }
    hits += `<rect class="hit" x="${m.l+i*band}" y="${m.t}" width="${band}" height="${ih}" data-i="${i}"/>`;
  }

  node.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img">${g}${bars}${hits}</svg>`;
  const svg = node.firstChild;
  svg.addEventListener('pointermove', e=>{
    const t = e.target.closest('.hit'); if(!t) return;
    const i = +t.dataset.i;
    let html = `<div class="t">${esc(cfg.labels[i])}</div>`;
    cfg.series.forEach((s,si)=> html += tipRow(cols[si], s.name, cfg.fmt(s.values[i])));
    if(cfg.stacked && cfg.series.length>1) html += tipRow(null,'Jumlah', cfg.fmt(sum(cfg.series,s=>s.values[i])));
    showTip(html, e.clientX, e.clientY);
  });
  svg.addEventListener('pointerleave', hideTip);
  svg.addEventListener('pointercancel', hideTip);
}

/* ============================ CARTA: BAR MELINTANG ============================ */
/* cfg: {items:[{label, values:[]}], series:[{name,varName}], fmt, stacked, sort} */
function drawBarH(node, cfg){
  const items = cfg.items;
  const W = Math.max(240, node.clientWidth);
  const narrow = W < 460;
  const rowH = (cfg.rowH || 26) + (narrow ? 4 : 0), pad = 8;
  const labW = narrow ? Math.max(66, Math.round(W*0.34)) : Math.min(160, Math.max(84, Math.round(W*0.28)));
  const m = {t:6, r:narrow?42:54, b:6, l:labW};
  const H = m.t+m.b+items.length*rowH;
  const iw = W-m.l-m.r;
  const cols = cfg.series.map(s=>cssVar(s.varName));
  const totals = items.map(it=> cfg.stacked ? sum(it.values) : Math.max(...it.values));
  const hi = Math.max(...totals) * 1.02 || 1;
  const X = v => v/hi*iw;

  let out='', hits='';
  items.forEach((it,i)=>{
    const y = m.t + i*rowH + 3, bh = rowH-pad;
    out += `<text x="${m.l-10}" y="${y+bh/2+4}" text-anchor="end" font-size="12" fill="${cssVar('--ink2')}">${esc(trunc(it.label, Math.max(8, Math.floor((labW-14)/6.4))))}</text>`;
    if(cfg.stacked){
      let acc=0;
      it.values.forEach((v,si)=>{
        const isLast = si===it.values.length-1;
        const w = Math.max(0, X(v) - (isLast?0:2));
        out += `<path d="${barPath(m.l+X(acc), y, w, bh, isLast?4:0, isLast?'right':'flat')}" fill="${cols[si]}"/>`;
        acc += v;
      });
      out += `<text x="${m.l+X(sum(it.values))+8}" y="${y+bh/2+4}" font-size="11.5" fill="${cssVar('--ink2')}" style="font-variant-numeric:tabular-nums">${esc(cfg.fmt(sum(it.values)))}</text>`;
    } else {
      const v = it.values[0];
      out += `<path d="${barPath(m.l, y, X(v), bh, 4,'right')}" fill="${cols[0]}"/>`;
      out += `<text x="${m.l+X(v)+8}" y="${y+bh/2+4}" font-size="11.5" fill="${cssVar('--ink2')}" style="font-variant-numeric:tabular-nums">${esc(cfg.fmt(v))}</text>`;
    }
    hits += `<rect class="hit" x="0" y="${m.t+i*rowH}" width="${W}" height="${rowH}" data-i="${i}"/>`;
  });

  node.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img">${out}${hits}</svg>`;
  const svg = node.firstChild;
  svg.addEventListener('pointermove', e=>{
    const t = e.target.closest('.hit'); if(!t) return;
    const i = +t.dataset.i, it = items[i];
    let html = `<div class="t">${esc(it.label)}</div>`;
    cfg.series.forEach((s,si)=> html += tipRow(cols[si], s.name, cfg.fmt(it.values[si])));
    if(cfg.stacked && it.values.length>1) html += tipRow(null,'Jumlah', cfg.fmt(sum(it.values)));
    showTip(html, e.clientX, e.clientY);
  });
  svg.addEventListener('pointerleave', hideTip);
  svg.addEventListener('pointercancel', hideTip);
}

/* ============================ CARTA: GARIS ============================ */
/* cfg: {labels:[], series:[{name,varName,values:[]}], fmt, yMin, yMax, invert} */
function drawLine(node, cfg){
  const W = Math.max(240, node.clientWidth);
  const narrow = W < 460;
  const H = Math.round((cfg.height || 250) * (narrow ? 0.88 : 1));
  const m = {t:14, r:narrow?10:16, b:narrow?38:34, l:narrow?36:46};
  const iw = W-m.l-m.r, ih = H-m.t-m.b;
  const cols = cfg.series.map(s=>cssVar(s.varName));
  const all = cfg.series.flatMap(s=>s.values).filter(v=> v!=null && isFinite(v));
  const ticks = niceTicks(cfg.yMin!=null?cfg.yMin:Math.min(...all), cfg.yMax!=null?cfg.yMax:Math.max(...all), 4);
  const lo = ticks[0], hi = ticks[ticks.length-1];
  const n = cfg.labels.length;
  const X = i => m.l + (n===1? iw/2 : i/(n-1)*iw);
  const Y = v => m.t + ih - (v-lo)/(hi-lo)*ih;

  let g='';
  ticks.forEach(t=>{
    g += `<line x1="${m.l}" y1="${Y(t).toFixed(1)}" x2="${m.l+iw}" y2="${Y(t).toFixed(1)}" stroke="${t===lo?cssVar('--axis'):cssVar('--grid')}" stroke-width="1"/>`;
    g += `<text x="${m.l-8}" y="${(Y(t)+4).toFixed(1)}" text-anchor="end" font-size="11" fill="${cssVar('--muted')}" style="font-variant-numeric:tabular-nums">${esc(cfg.tickFmt?cfg.tickFmt(t):fmtInt(t))}</text>`;
  });
  const lstep = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(iw/40))));
  cfg.labels.forEach((l,i)=>{
    if(i % lstep !== 0 && i !== n-1) return;
    g += `<text x="${X(i).toFixed(1)}" y="${m.t+ih+18}" text-anchor="middle" font-size="11" fill="${cssVar('--muted')}">${esc(l)}</text>`;
  });

  let paths='', dots='', labels='';
  cfg.series.forEach((s,si)=>{
    let mula = true;
    const d = s.values.map((v,i)=>{
      if(v==null || !isFinite(v)){ mula = true; return ''; }
      const seg = `${mula?'M':'L'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`;
      mula = false; return seg;
    }).filter(Boolean).join(' ');
    paths += `<path d="${d}" fill="none" stroke="${cols[si]}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
    s.values.forEach((v,i)=>{
      if(v==null || !isFinite(v)) return;
      dots += `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="4" fill="${cols[si]}" stroke="${cssVar('--surface')}" stroke-width="2"/>`;
    });
    let li = -1;
    for(let i=s.values.length-1;i>=0;i--){ const v=s.values[i]; if(v!=null && isFinite(v)){ li=i; break; } }
    if(li>=0)
      labels += `<text x="${(X(li)-6).toFixed(1)}" y="${(Y(s.values[li])-11).toFixed(1)}" text-anchor="end" font-size="11.5" font-weight="600" fill="${cssVar('--ink2')}" style="font-variant-numeric:tabular-nums">${esc(cfg.fmt(s.values[li]))}</text>`;
  });

  let hits='';
  for(let i=0;i<n;i++){
    const w = n===1?iw:iw/(n-1);
    hits += `<rect class="hit" x="${(X(i)-w/2).toFixed(1)}" y="${m.t}" width="${w.toFixed(1)}" height="${ih}" data-i="${i}"/>`;
  }
  const cross = `<line id="ch" x1="0" y1="${m.t}" x2="0" y2="${m.t+ih}" stroke="${cssVar('--axis')}" stroke-width="1" opacity="0"/>`;

  node.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img">${g}${cross}${paths}${dots}${labels}${hits}</svg>`;
  const svg = node.firstChild, ch = svg.querySelector('#ch');
  svg.addEventListener('pointermove', e=>{
    const t = e.target.closest('.hit'); if(!t) return;
    const i = +t.dataset.i;
    ch.setAttribute('x1', X(i)); ch.setAttribute('x2', X(i)); ch.setAttribute('opacity','1');
    let html = `<div class="t">${esc(cfg.labels[i])}</div>`;
    cfg.series.forEach((s,si)=>{
      const v = s.values[i];
      html += tipRow(cols[si], s.name, (v==null || !isFinite(v)) ? '—' : cfg.fmt(v));
    });
    showTip(html, e.clientX, e.clientY);
  });
  const off = ()=>{ ch.setAttribute('opacity','0'); hideTip(); };
  svg.addEventListener('pointerleave', off);
  svg.addEventListener('pointercancel', off);
}

/* ============================ CARTA: TITIK (julat sempit) ============================ */
/* cfg: {items:[{label,values:[v]}], series:[{name,varName}], fmt, dmin, dmax, ref:{value,label}} */
function drawDot(node, cfg){
  const items = cfg.items;
  const W = Math.max(240, node.clientWidth);
  const narrow = W < 460;
  const rowH = (cfg.rowH || 26) + (narrow?2:0);
  const labW = narrow ? Math.max(66, Math.round(W*0.32)) : Math.min(160, Math.max(84, Math.round(W*0.26)));
  const m = {t:6, r:narrow?44:56, b:28, l:labW};
  const H = m.t + m.b + items.length*rowH;
  const iw = W-m.l-m.r, ih = items.length*rowH;
  const vals = items.map(i=>i.values[0]);
  const lo = cfg.dmin!=null ? cfg.dmin : Math.floor(Math.min(...vals)-1);
  const hi = cfg.dmax!=null ? cfg.dmax : Math.ceil(Math.max(...vals)+1);
  const X = v => m.l + (v-lo)/(hi-lo)*iw;
  const col = cssVar(cfg.series[0].varName);
  const ticks = niceTicks(lo,hi,narrow?3:5).filter(t=>t>=lo && t<=hi);

  let g='';
  ticks.forEach(t=>{
    g += `<line x1="${X(t).toFixed(1)}" y1="${m.t}" x2="${X(t).toFixed(1)}" y2="${m.t+ih}" stroke="${cssVar('--grid')}" stroke-width="1"/>`;
    g += `<text x="${X(t).toFixed(1)}" y="${m.t+ih+18}" text-anchor="middle" font-size="11" fill="${cssVar('--muted')}" style="font-variant-numeric:tabular-nums">${esc(cfg.tickFmt?cfg.tickFmt(t):fmtInt(t))}</text>`;
  });
  if(cfg.ref && cfg.ref.value>=lo && cfg.ref.value<=hi){
    g += `<line x1="${X(cfg.ref.value).toFixed(1)}" y1="${m.t}" x2="${X(cfg.ref.value).toFixed(1)}" y2="${m.t+ih}" stroke="${cssVar('--axis')}" stroke-width="1.5"/>`;
  }

  let out='', hits='';
  items.forEach((it,i)=>{
    const cy = m.t + i*rowH + rowH/2;
    const v = it.values[0];
    out += `<text x="${m.l-10}" y="${cy+4}" text-anchor="end" font-size="12" fill="${cssVar('--ink2')}">${esc(trunc(it.label, Math.max(8, Math.floor((labW-14)/6.4))))}</text>`;
    out += `<line x1="${m.l}" y1="${cy}" x2="${X(v).toFixed(1)}" y2="${cy}" stroke="${cssVar('--grid')}" stroke-width="2" stroke-linecap="round"/>`;
    out += `<circle cx="${X(v).toFixed(1)}" cy="${cy}" r="5.5" fill="${col}" stroke="${cssVar('--surface')}" stroke-width="2"/>`;
    out += `<text x="${(X(v)+11).toFixed(1)}" y="${cy+4}" font-size="11.5" fill="${cssVar('--ink2')}" style="font-variant-numeric:tabular-nums">${esc(cfg.fmt(v))}</text>`;
    hits += `<rect class="hit" x="0" y="${m.t+i*rowH}" width="${W}" height="${rowH}" data-i="${i}"/>`;
  });

  node.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img">${g}${out}${hits}</svg>`;
  const svg = node.firstChild;
  svg.addEventListener('pointermove', e=>{
    const t = e.target.closest('.hit'); if(!t) return;
    const i = +t.dataset.i, it = items[i];
    let html = `<div class="t">${esc(it.label)}</div>` + tipRow(col, cfg.series[0].name, cfg.fmt(it.values[0]));
    if(cfg.ref) html += tipRow(null, cfg.ref.label, cfg.fmt(cfg.ref.value));
    showTip(html, e.clientX, e.clientY);
  });
  svg.addEventListener('pointerleave', hideTip);
  svg.addEventListener('pointercancel', hideTip);
}

function tableHTML(cfg){

  const rows = cfg.tableRows();
  return `<div class="tblwrap"><table><thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>`
    + `<tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function addCard(parent, spec){
  const col = document.createElement('div');
  col.className = 'card ' + (spec.col||'col-6');
  col.innerHTML = `<header><div><h2>${esc(spec.title)}</h2></div><button class="tgl" type="button">Jadual</button></header>
    <div class="note">${esc(spec.note||'')}</div>
    <div class="legendslot"></div>
    <div class="chart"></div>
    <div class="tblslot" hidden></div>`;
  parent.appendChild(col);
  const chart = $('.chart',col), tbl = $('.tblslot',col), lg = $('.legendslot',col), btn = $('.tgl',col);
  const item = { col, chart, tbl, lg, spec, showTable: spec.type==='table' };
  if(spec.type==='table') btn.hidden = true;
  btn.addEventListener('click', ()=>{
    item.showTable = !item.showTable;
    btn.textContent = item.showTable ? 'Carta' : 'Jadual';
    paintCard(item);
  });
  REG.push(item);
  return item;
}
function adaData_(spec, cfg){
  if(spec.type==='table') return (cfg.tableRows()||[]).length > 0;
  if(spec.type==='barh' || spec.type==='dot') return (cfg.items||[]).length > 0;
  return (cfg.labels||[]).length > 0 && (cfg.series||[]).some(s=>(s.values||[]).length);
}
function paintCard(item){
  const cfg = item.spec.cfg();
  if(!adaData_(item.spec, cfg)){
    item.lg.innerHTML = ''; item.tbl.hidden = true; item.chart.hidden = false;
    item.chart.innerHTML = '<div class="empty">Tiada data untuk sesi ini.<br>Isi data dalam sumber, kemudian kemas kini <b>data.json</b>.</div>';
    return;
  }
  if(item.showTable){
    item.chart.hidden = true; item.lg.hidden = true;
    item.tbl.hidden = false; item.tbl.innerHTML = tableHTML(cfg);
  } else {
    item.tbl.hidden = true; item.chart.hidden = false; item.lg.hidden = false;
    item.lg.innerHTML = legendHTML(cfg.series);
    if(item.spec.type==='column') drawColumn(item.chart, cfg);
    else if(item.spec.type==='barh') drawBarH(item.chart, cfg);
    else if(item.spec.type==='dot') drawDot(item.chart, cfg);
    else drawLine(item.chart, cfg);
  }
}

/* ============================ TILE ============================ */
function tile(parent, {lab, val, unit, delta, deltaLab, better}){
  const d = document.createElement('div'); d.className='tile';
  let dh = '';
  if(delta!=null && isFinite(delta)){
    const good = better==='down' ? delta<0 : delta>0;
    const cls = delta===0 ? '' : (good?'up':'down');
    const arrow = delta===0 ? '→' : (delta>0?'↑':'↓');
    dh = `<div class="delta ${cls}">${arrow} ${esc(deltaLab)}</div>`;
  }
  d.innerHTML = `<div class="lab">${esc(lab)}</div><div class="val">${esc(val)}${unit?`<small>${esc(unit)}</small>`:''}</div>${dh}`;
  parent.appendChild(d);
}

const TABS = [
  {id:'ringkasan',  nama:'Ringkasan'},
  {id:'enrolmen',   nama:'Enrolmen'},
  {id:'kehadiran',  nama:'Kehadiran'},
  {id:'akademik',   nama:'Akademik'},
  {id:'hem',        nama:'HEM'},
  {id:'kokurikulum',nama:'Kokurikulum'}
];

function S(){ return DATA.sesi[STATE.sesi] || {}; }
/* Blok akademik untuk peperiksaan yang dipilih (fallback: peperiksaan aktif). */
function AK(){
  const a = S().akademik || {};
  if(STATE.pep && Array.isArray(a.peperiksaan_semua)){
    const f = a.peperiksaan_semua.find(x=>x.peperiksaan===STATE.pep);
    if(f) return Object.assign({}, a, f);
  }
  return a;
}
function HEM(){ const s = S(); return s.hem || s.sahsiah || {}; }
function Sprev(){
  const keys = Object.keys(DATA.sesi).sort();
  const i = keys.indexOf(STATE.sesi);
  return i>0 ? DATA.sesi[keys[i-1]] : null;
}
function jumlahMurid(s){ return s && s.enrolmen ? sum(s.enrolmen.ikut_tahun, r=>r.lelaki+r.perempuan) : 0; }
function purataKehadiran(s,k){
  if(!s || !s.kehadiran || !s.kehadiran.bulanan.length) return null;
  return sum(s.kehadiran.bulanan, r=>r[k]) / s.kehadiran.bulanan.length;
}

function build(){
  const main = $('#main'); main.innerHTML=''; REG.length=0;
  TABS.forEach(t=>{
    const sec = document.createElement('section');
    sec.className='sect'; sec.id='sect-'+t.id;
    sec.hidden = t.id!==STATE.tab;
    main.appendChild(sec);
    ({ringkasan:secRingkasan, enrolmen:secEnrolmen, akademik:secAkademik,
      kehadiran:secKehadiran, hem:secHem, kokurikulum:secKoku}[t.id])(sec);
  });
  REG.forEach(paintCard);
}

function secRingkasan(sec){
  const s = S(), p = Sprev();
  const tiles = document.createElement('div'); tiles.className='tiles'; sec.appendChild(tiles);
  const jm = jumlahMurid(s), jmp = p?jumlahMurid(p):null;
  tile(tiles,{lab:'Jumlah murid', val:fmtInt(jm), delta: jmp!=null?jm-jmp:null,
    deltaLab: jmp!=null?`${Math.abs(jm-jmp)} murid berbanding sesi lepas`:'', better:'up'});
  const gs = (s.enrolmen?.guru||0)+(s.enrolmen?.staf_sokongan||0);
  const gsp = p ? (p.enrolmen?.guru||0)+(p.enrolmen?.staf_sokongan||0) : null;
  const nisbah = s.enrolmen?.guru ? jm/s.enrolmen.guru : 0;
  tile(tiles,{lab:'Guru & staf', val:fmtInt(gs),
    delta: gsp!=null ? gs-gsp : null,
    deltaLab: `nisbah murid:guru 1 : ${nf1.format(nisbah)}`, better:'up'});
  const kh = purataKehadiran(s,'murid'), khp = p?purataKehadiran(p,'murid'):null;
  tile(tiles,{lab:'Purata kehadiran murid', val:nf1.format(kh||0), unit:'%',
    delta: khp!=null?kh-khp:null, deltaLab: khp!=null?`${nf1.format(Math.abs(kh-khp))} mata`:'', better:'up'});
  const gps = s.akademik?.gps, gpsp = p?.akademik?.gps;
  tile(tiles,{lab:'GPS (semakin rendah semakin baik)', val:fmtGp(gps||0),
    delta: gpsp!=null?gps-gpsp:null, deltaLab: gpsp!=null?`${nf2.format(Math.abs(gps-gpsp))} mata`:'', better:'down'});
  const pl = s.akademik?.peratus_lulus, plp = p?.akademik?.peratus_lulus;
  tile(tiles,{lab:'Peratus lulus', val:nf1.format(pl||0), unit:'%',
    delta: plp!=null?pl-plp:null, deltaLab: plp!=null?`${nf1.format(Math.abs(pl-plp))} mata`:'', better:'up'});
  const kk = s.kokurikulum?.peratus_penyertaan, kkp = p?.kokurikulum?.peratus_penyertaan;
  tile(tiles,{lab:'Penyertaan kokurikulum', val:nf1.format(kk||0), unit:'%',
    delta: kkp!=null?kk-kkp:null, deltaLab: kkp!=null?`${nf1.format(Math.abs(kk-kkp))} mata`:'', better:'up'});

  const g = document.createElement('div'); g.className='grid'; sec.appendChild(g);
  addCard(g,{title:'Kehadiran bulanan', col:'col-8', type:'line',
    note:'Peratus kehadiran purata murid dan guru mengikut bulan.',
    cfg: cfgKehadiranBulanan});
  addCard(g,{title:'Trend GPS', col:'col-4', type:'line',
    note:'Gred purata sekolah mengikut penilaian. Nilai lebih rendah = lebih baik.',
    cfg: cfgTrendGps});
  addCard(g,{title:'Enrolmen mengikut tahun', col:'col-6', type:'column',
    note:'Bilangan murid, dipecah mengikut jantina.', cfg: cfgEnrolTahun});
  addCard(g,{title:'GPMP mengikut mata pelajaran', col:'col-6', type:'barh',
    note:'Gred purata mata pelajaran. Nilai lebih rendah = lebih baik.', cfg: cfgGpmp});
}

function secHem(sec){
  const s = S(), h = HEM();
  const tiles = document.createElement('div'); tiles.className='tiles'; sec.appendChild(tiles);

  tile(tiles,{lab:'Pemimpin murid', val:fmtInt(pemimpin),

function secKoku(sec){

/* ============================ CONFIG CARTA ============================ */
function cfgKehadiranBulanan(){
  const rows = tail(S().kehadiran?.bulanan || []);
  const adaGuru = rows.some(r=> typeof r.guru === 'number' && isFinite(r.guru));
  const series = [{name:'Murid', varName:'--s1', values: rows.map(r=>r.murid)}];
  if(adaGuru) series.push({name:'Guru', varName:'--s2',
    values: rows.map(r=> (typeof r.guru==='number' && isFinite(r.guru)) ? r.guru : null)});
  const lows = rows.flatMap(r=> adaGuru ? [r.murid, r.guru] : [r.murid])
                   .filter(v=> typeof v === 'number' && isFinite(v));
  return {labels: rows.map(r=>r.bulan), series, fmt: fmtPct, tickFmt: v=>v+'%',
    yMin: lows.length ? Math.max(0, Math.floor((Math.min(...lows)-1.5)/2)*2) : 80,
    yMax: 100, height: 260,
    tableHead: adaGuru ? ['Bulan','Murid (%)','Guru (%)'] : ['Bulan','Murid (%)'],
    tableRows: ()=> rows.map(r=> adaGuru
      ? [r.bulan, nf1.format(r.murid), nf1.format(r.guru)]
      : [r.bulan, nf1.format(r.murid)])};
}
function cfgTrendGps(){
  const rows = S().akademik?.trend_gps || [];
  const series = [{name:'GPS', varName:'--s1', values: rows.map(r=>r.gps)}];
  return {labels: rows.map(r=>r.penilaian), series, fmt: fmtGp, tickFmt: v=>nf1.format(v),
    height: 260,
    tableHead:['Penilaian','GPS'],
    tableRows: ()=> rows.map(r=>[r.penilaian, nf2.format(r.gps)])};
}
function cfgEnrolTahun(){
  const rows = S().enrolmen?.ikut_tahun || [];
  const series = [
    {name:'Lelaki', varName:'--s1', values: rows.map(r=>r.lelaki)},
    {name:'Perempuan', varName:'--s2', values: rows.map(r=>r.perempuan)}
  ];
  return {labels: rows.map(r=>r.tahun.replace('Tahun ','T')), series, stacked:true, fmt: fmtInt,
    height: 250,
    tableHead:['Tahun','Lelaki','Perempuan','Jumlah'],
    tableRows: ()=> rows.map(r=>[r.tahun, fmtInt(r.lelaki), fmtInt(r.perempuan), fmtInt(r.lelaki+r.perempuan)])};
}
function cfgKaum(){
  const rows = (S().enrolmen?.ikut_kaum || []).slice().sort((a,b)=>b.bilangan-a.bilangan);
  const jum = sum(rows,r=>r.bilangan) || 1;
  return {items: rows.map(r=>({label:r.kaum, values:[r.bilangan]})),
    series:[{name:'Murid', varName:'--s1'}], fmt: fmtInt, rowH:32,
    tableHead:['Kaum','Murid','Peratus'],
    tableRows: ()=> rows.map(r=>[r.kaum, fmtInt(r.bilangan), nf1.format(r.bilangan/jum*100)+'%'])};

function cfgProfil(){
  const e = S().enrolmen || {}, p = Sprev();
  const murid = jumlahMurid(S());
  const nisbah = e.guru ? murid/e.guru : 0;
  const saiz = e.kelas ? murid/e.kelas : 0;
  const pe = p ? p.enrolmen || {} : null;
  const pmurid = p ? jumlahMurid(p) : null;
  const baris = [
    ['Jumlah murid', fmtInt(murid), pe? fmtInt(pmurid):'—'],
    ['Guru', fmtInt(e.guru||0), pe? fmtInt(pe.guru||0):'—'],
    ['Staf sokongan', fmtInt(e.staf_sokongan||0), pe? fmtInt(pe.staf_sokongan||0):'—'],
    ['Bilangan kelas', fmtInt(e.kelas||0), pe? fmtInt(pe.kelas||0):'—'],
    ['Nisbah murid : guru', '1 : '+nf1.format(nisbah), pe&&pe.guru? '1 : '+nf1.format(pmurid/pe.guru):'—'],
    ['Purata saiz kelas', nf1.format(saiz)+' murid', pe&&pe.kelas? nf1.format(pmurid/pe.kelas)+' murid':'—']

  return {series:[], tableHead:['Perkara','Sesi '+STATE.sesi,'Sesi sebelum'], tableRows: ()=> baris};

    tableHead:['Mata pelajaran','% Lulus','% A'],

function cfgPbd(){
  const rows = AK().pbd_tahap || [];
  const jum = sum(rows,r=>r.bilangan) || 1;
  return {labels: rows.map(r=>r.tahap),
    series:[{name:'Murid', varName:'--s1', values: rows.map(r=>r.bilangan)}],
    fmt: fmtInt, height: 250,
    tableHead:['Tahap','Murid','Peratus'],
    tableRows: ()=> rows.map(r=>[r.tahap, fmtInt(r.bilangan), nf1.format(r.bilangan/jum*100)+'%'])};

function cfgGpsKelas(){
  const a = AK();
  const rows = (a.ikut_kelas || []).slice().sort((x,y)=>x.gps-y.gps);
  const vals = rows.map(r=>r.gps);

    dmin: vals.length ? Math.max(1, Math.floor((Math.min(...vals)-0.3)*10)/10) : 1,
    dmax: vals.length ? Math.min(6, Math.ceil((Math.max(...vals)+0.3)*10)/10) : 6,
    tickFmt: v=>nf1.format(v), ref:{value:gpsSek, label:'GPS sekolah'},

    tableRows: ()=> rows.map(r=>[r.kelas, nf2.format(r.gps), nf1.format(r.peratus_lulus||0)+'%', fmtInt(r.murid||0)])};

function cfgKehadiranKelas(){
  const rows = (S().kehadiran?.ikut_kelas || []).slice().sort((a,b)=>b.peratus-a.peratus);
  const vals = rows.map(r=>r.peratus);
  const purata = vals.length ? sum(vals)/vals.length : 0;
  return {items: rows.map(r=>({label:r.kelas, values:[r.peratus]})),
    series:[{name:'Kehadiran', varName:'--s1'}], fmt: fmtPct, rowH:28,
    dmin: Math.floor(Math.min(...vals)-1), dmax: Math.min(100, Math.ceil(Math.max(...vals)+1)),
    tickFmt: v=>v+'%', ref:{value:purata, label:'Purata sekolah'},
    tableHead:['Kelas','Kehadiran (%)','Beza dari purata'],
    tableRows: ()=> rows.map(r=>[r.kelas, nf1.format(r.peratus), (r.peratus>=purata?'+':'−')+nf1.format(Math.abs(r.peratus-purata))])};
}
function cfgBidang(){
  const rows = (S().kokurikulum?.ikut_bidang || []).slice().sort((a,b)=>b.murid-a.murid);
  return {items: rows.map(r=>({label:r.bidang, values:[r.murid]})),
    series:[{name:'Murid', varName:'--s1'}], fmt: fmtInt, rowH:34,
    tableHead:['Bidang','Murid'],
    tableRows: ()=> rows.map(r=>[r.bidang, fmtInt(r.murid)])};
}
function cfgPencapaian(){
  const rows = S().kokurikulum?.pencapaian || [];
  return {labels: rows.map(r=>r.peringkat),
    series:[{name:'Pencapaian', varName:'--s3', values: rows.map(r=>r.bilangan)}],
    fmt: fmtInt, height: 240,
    tableHead:['Peringkat','Bilangan'],
    tableRows: ()=> rows.map(r=>[r.peringkat, fmtInt(r.bilangan)])};
}
function cfgKepimpinan(){
  const rows = (HEM().kepimpinan || []).slice().sort((a,b)=>b.murid-a.murid);
  const murid = jumlahMurid(S()) || 1;
  return {items: rows.map(r=>({label:r.jawatan, values:[r.murid]})),
    series:[{name:'Murid', varName:'--s1'}], fmt: fmtInt, rowH:30,
    tableHead:['Jawatan / badan','Murid','% enrolmen'],
    tableRows: ()=> rows.map(r=>[r.jawatan, fmtInt(r.murid), nf1.format(r.murid/murid*100)+'%'])};
}
function cfgProfilMurid(){
  const rows = HEM().profil_murid || [];
  const murid = jumlahMurid(S()) || 1;
  const p = Sprev(), hp = p ? (p.hem || p.sahsiah || {}) : null;
  const lepas = {}; (hp?.profil_murid||[]).forEach(r=> lepas[r.perkara]=r.bilangan);
  return {series:[],
    tableHead:['Perkara','Bilangan','% enrolmen','Sesi sebelum'],
    tableRows: ()=> rows.map(r=>[r.perkara, fmtInt(r.bilangan),
      nf1.format(r.bilangan/murid*100)+'%',
      lepas[r.perkara]!=null ? fmtInt(lepas[r.perkara]) : '—'])};
}

function cfgBantuan(){
  const rows = (HEM().bantuan || []).slice().sort((a,b)=>b.murid-a.murid);
  const murid = jumlahMurid(S()) || 1;
  return {items: rows.map(r=>({label:r.jenis, values:[r.murid]})),
    series:[{name:'Murid', varName:'--s3'}], fmt: fmtInt, rowH:32,
    tableHead:['Jenis bantuan','Murid','% enrolmen'],
    tableRows: ()=> rows.map(r=>[r.jenis, fmtInt(r.murid), nf1.format(r.murid/murid*100)+'%'])};
}

/* ============================ LAPORAN RINGKAS ============================ */
function tarikhHariIni(){
  return new Date().toLocaleDateString('ms-MY',{day:'numeric',month:'long',year:'numeric'});
}
function kpiBox(l,v,u){
  return `<div><div class="l">${esc(l)}</div><div class="v">${esc(v)}${u?`<small>${esc(u)}</small>`:''}</div></div>`;
}
function buildLaporan(){
  const s = S(), h = HEM(), sk = DATA.sekolah || {};
  const murid = jumlahMurid(s);
  const kh = purataKehadiran(s,'murid');
  const pemimpin = sum(h.kepimpinan||[], r=>r.murid);
  const el = $('#laporan');

  el.innerHTML = `
    <div class="lapbar">
      <button type="button" data-lap="cetak">Cetak laporan</button>
      <button type="button" data-lap="kembali">Kembali ke dashboard</button>
    </div>
    <div class="kepala">
      <img src="${esc(sk.logo || LOGO_TERBINA)}" alt="Logo sekolah">
      <div>
        <h2>${esc(sk.nama || 'Sekolah')}</h2>
        <div class="meta">${[sk.kod, sk.daerah].filter(Boolean).map(esc).join(' &middot; ')}</div>
        <div class="meta"><b>Laporan Ringkas Prestasi Sekolah &mdash; Sesi ${esc(STATE.sesi)}</b></div>
      </div>
      <div class="kanan">Dicetak: ${esc(tarikhHariIni())}<br>Dashboard SePadan</div>
    </div>

    <div class="kpi">
      ${kpiBox('Jumlah murid', fmtInt(murid))}
      ${kpiBox('Guru & staf', fmtInt((s.enrolmen?.guru||0)+(s.enrolmen?.staf_sokongan||0)))}
      ${kpiBox('Kehadiran murid', nf1.format(kh||0), '%')}
      ${kpiBox('GPS', fmtGp(s.akademik?.gps||0))}
      ${kpiBox('Peratus lulus', nf1.format(s.akademik?.peratus_lulus||0), '%')}
      ${kpiBox('Penyertaan koku', nf1.format(s.kokurikulum?.peratus_penyertaan||0), '%')}
    </div>

    <div class="dua">
      <div class="blok"><h3>Kehadiran bulanan (murid &amp; guru)</h3><div class="chart" id="lapC1"></div></div>
      <div class="blok"><h3>GPMP mengikut mata pelajaran</h3><div class="chart" id="lapC2"></div></div>
    </div>

    <div class="blok"><h3>Enrolmen mengikut tahun</h3>${tableHTML(cfgEnrolTahun())}</div>

    <div class="muka2">
      <div class="kepala">
        <img src="${esc(sk.logo || LOGO_TERBINA)}" alt="">
        <div>
          <h2>${esc(sk.nama || 'Sekolah')}</h2>
          <div class="meta"><b>Laporan Ringkas &mdash; Lampiran Data (Sesi ${esc(STATE.sesi)})</b></div>
        </div>
        <div class="kanan">Muka 2 / 2</div>
      </div>
      <div class="blok"><h3>Prestasi mengikut mata pelajaran</h3>${tableHTML(cfgGpmp())}</div>
      <div class="dua">
        <div class="blok"><h3>Kehadiran mengikut kelas</h3>${tableHTML(cfgKehadiranKelas())}</div>
        <div class="blok"><h3>Badan kepimpinan murid</h3>${tableHTML(cfgKepimpinan())}</div>
      </div>
      <div class="dua">
        <div class="blok"><h3>Bantuan &amp; kebajikan murid</h3>${tableHTML(cfgBantuan())}</div>
        <div class="blok"><h3>Pencapaian kokurikulum</h3>${tableHTML(cfgPencapaian())}</div>
      </div>
      <div class="nota">Pemimpin murid: ${fmtInt(pemimpin)} orang (${murid? nf1.format(pemimpin/murid*100):'0'}% daripada enrolmen). Dijana daripada Dashboard SePadan pada ${esc(tarikhHariIni())}.</div>
    </div>`;

  drawLine($('#lapC1'), Object.assign(cfgKehadiranBulanan(), {height:210}));
  drawBarH($('#lapC2'), Object.assign(cfgGpmp(), {rowH:24}));

  el.querySelectorAll('[data-lap]').forEach(b=>{
    b.addEventListener('click', ()=> b.dataset.lap==='cetak' ? window.print() : tutupLaporan());
  });
}
function bukaLaporan(){
  if(document.documentElement.hasAttribute('data-tv')) tvOff();
  $('#laporan').hidden = false;
  document.documentElement.setAttribute('data-mode','laporan');
  buildLaporan();
  scrollTo(0,0);
}
function tutupLaporan(){
  document.documentElement.removeAttribute('data-mode');
  $('#laporan').hidden = true; $('#laporan').innerHTML = '';
  REG.forEach(paintCard);
}

/* ============================ MOD TV ============================ */
let tvTimer = null, TV_SAAT = 20;
function tvBarMula(){
  const bar = $('#tvbar').firstElementChild;
  bar.style.transition = 'none'; bar.style.width = '0%';
  requestAnimationFrame(()=>{ requestAnimationFrame(()=>{
    bar.style.transition = `width ${TV_SAAT}s linear`; bar.style.width = '100%';
  });});
}
function tvSeterusnya(){
  const i = TABS.findIndex(t=>t.id===STATE.tab);
  const nx = TABS[(i+1) % TABS.length];
  const btn = [...$('#tabs').querySelectorAll('button')][TABS.indexOf(nx)];
  if(btn) btn.click();
  tvBarMula();
}
function tvOn(){
  document.documentElement.setAttribute('data-tv','');
  $('#tvExit').hidden = false;
  $('#btnTv').textContent = 'Keluar TV';
  if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
  tvBarMula();
  clearInterval(tvTimer);
  tvTimer = setInterval(tvSeterusnya, TV_SAAT*1000);
  setTimeout(()=> REG.forEach(paintCard), 60);
}
function tvOff(){
  clearInterval(tvTimer); tvTimer = null;
  document.documentElement.removeAttribute('data-tv');
  $('#tvExit').hidden = true;
  $('#btnTv').textContent = 'Mod TV';
  if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{});
  setTimeout(()=> REG.forEach(paintCard), 60);
}
function tvToggle(){ document.documentElement.hasAttribute('data-tv') ? tvOff() : tvOn(); }

addEventListener('keydown', e=>{
  if(e.key !== 'Escape') return;
  if(document.documentElement.hasAttribute('data-tv')) tvOff();
  else if(document.documentElement.getAttribute('data-mode')==='laporan') tutupLaporan();
});
addEventListener('fullscreenchange', ()=>{
  if(!document.fullscreenElement && document.documentElement.hasAttribute('data-tv')) tvOff();
});

/* ============================ KAWALAN ============================ */
function renderTabs(){
  const nav = $('#tabs'); nav.innerHTML='';
  TABS.forEach(t=>{
    const b = document.createElement('button');
    b.type='button'; b.textContent=t.nama; b.setAttribute('role','tab');
    b.setAttribute('aria-selected', String(t.id===STATE.tab));
    b.addEventListener('click', ()=>{
      STATE.tab = t.id;
      nav.querySelectorAll('button').forEach(x=>x.setAttribute('aria-selected','false'));
      b.setAttribute('aria-selected','true');
      TABS.forEach(tt=> $('#sect-'+tt.id).hidden = tt.id!==STATE.tab);
      REG.forEach(paintCard);
    });
    nav.appendChild(b);
  });
}
function renderHeader(){
  const s = DATA.sekolah || {};
  $('#schoolName').textContent = s.nama || 'Sekolah';
  const src = s.logo || LOGO_TERBINA;
  const img = $('#crestImg'), txt = $('#crestTxt');
  if(src){
    img.src = src; img.hidden = false; txt.hidden = true;
    img.alt = 'Logo ' + (s.nama || 'sekolah');
    img.onerror = ()=>{ img.hidden = true; txt.hidden = false; };
  } else {
    img.hidden = true; txt.hidden = false;
  }
  txt.textContent = s.singkatan || (s.nama||'S').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  $('#schoolSub').textContent = ['Dashboard SePadan', s.kod, s.daerah].filter(Boolean).join(' · ');
  document.title = `Dashboard SePadan — ${s.nama||''}`;
  const d = s.dikemaskini ? new Date(s.dikemaskini) : null;
  $('#stamp').textContent = d && !isNaN(d)
    ? 'Data dikemaskini: ' + d.toLocaleDateString('ms-MY',{day:'numeric',month:'long',year:'numeric'})
    : '';
}
function renderSesi(){
  const sel = $('#selSesi'); sel.innerHTML='';
  Object.keys(DATA.sesi).sort().reverse().forEach(k=>{
    const o = document.createElement('option'); o.value=k; o.textContent='Sesi '+k; sel.appendChild(o);
  });
  STATE.sesi = DATA.sesi[DATA.sesi_semasa] ? DATA.sesi_semasa : Object.keys(DATA.sesi).sort().pop();
  sel.value = STATE.sesi;
}
function boot(){
  renderHeader(); renderSesi(); renderTabs(); build();
}
$('#selSesi').addEventListener('change', e=>{ STATE.sesi = e.target.value; build(); });
$('#selDensity').addEventListener('change', e=>{ STATE.density = e.target.value; REG.forEach(paintCard); });
$('#btnPrint').addEventListener('click', ()=> window.print());
$('#btnLaporan').addEventListener('click', bukaLaporan);
$('#btnTv').addEventListener('click', tvToggle);
$('#tvExit').addEventListener('click', tvOff);
$('#btnTheme').addEventListener('click', ()=>{
  const cur = document.documentElement.getAttribute('data-theme');
  const dark = cur ? cur==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', dark?'light':'dark');
  $('#btnTheme').textContent = dark ? 'Mod gelap' : 'Mod cerah';
  REG.forEach(paintCard);
});
$('#fileIn').addEventListener('change', e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const j = JSON.parse(r.result);
      if(!j.sesi) throw new Error('Tiada kunci "sesi" dalam fail.');
      DATA = j; $('#srcPill').textContent = 'Sumber data: ' + f.name;
      boot();
    }catch(err){ alert('Fail JSON tidak sah: ' + err.message); }
  };
  r.readAsText(f);
});

addEventListener('scroll', hideTip, {passive:true});
document.addEventListener('pointerdown', e=>{ if(!e.target.closest('.chart')) hideTip(); });

let rt;
addEventListener('resize', ()=>{ clearTimeout(rt); rt = setTimeout(()=> REG.forEach(paintCard), 140); });

/* Cuba muat data luaran; jika gagal (mis. dibuka terus dari fail), guna data terbina. */
(async function init(){
  const q = new URLSearchParams(location.search).get('data');
  const url = q || 'data.json';
  if(!q && location.protocol === 'file:'){ boot(); return; }
  try{
    const res = await fetch(url, {cache:'no-store'});
    if(res.ok){
      const j = await res.json();
      if(j && j.sesi){ DATA = j; $('#srcPill').textContent = 'Sumber data: ' + url; }
    }
  }catch(e){ /* senyap — guna data terbina */ }
  boot();
})();
</script>
</body>
</html>
